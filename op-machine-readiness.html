<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ความพร้อมใช้งานเครื่องจักร</title>
<style>
  :root{ --navy:#0e2a3d; --teal:#0f7a72; --green:#1c9c63; --amber:#c9821a; --red:#c0392b; --line:#e4e4e0; --muted:#6b7178; --bg:#f6f6f2; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Sarabun","Tahoma",sans-serif;background:var(--bg);color:var(--navy);}
  .topbar{background:var(--navy);color:#fff;padding:16px 18px;}
  .topbar h1{font-size:16px;margin:0 0 2px;}
  .topbar a{color:#fff;opacity:.75;font-size:12px;text-decoration:none;}
  .wrap{max-width:640px;margin:0 auto;padding:16px;}
  .summary{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .sumcard{flex:1;min-width:100px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center;}
  .sumcard .num{font-size:22px;font-weight:800;}
  .sumcard .label{font-size:11px;color:var(--muted);}
  .sumcard.issue .num{color:var(--red);}
  input[type="text"]{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:14.5px;margin-bottom:14px;font-family:inherit;}
  .cat-title{font-size:13.5px;font-weight:800;margin:18px 0 8px;color:var(--muted);}
  .cat-title:first-child{margin-top:0;}
  .mrow{
    background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;
    display:flex;justify-content:space-between;align-items:center;cursor:pointer;
  }
  .mrow .name{font-size:13.5px;font-weight:700;}
  .mrow .qty{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .badge{font-size:12px;font-weight:800;border-radius:999px;padding:4px 12px;white-space:nowrap;}
  .badge.full{background:#e3f6ea;color:var(--green);}
  .badge.partial{background:#fdf1e3;color:var(--amber);}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:50;}
  .modal-bg.show{display:flex;}
  .modal{background:#fff;border-radius:16px 16px 0 0;padding:20px;width:100%;max-height:85vh;overflow:auto;}
  .modal h3{margin:0 0 2px;font-size:16px;}
  .modal .sub{font-size:12px;color:var(--muted);margin-bottom:14px;}
  .issue-card{background:var(--bg);border-radius:10px;padding:12px;margin-bottom:10px;}
  .issue-card .detail{font-size:13px;margin-bottom:6px;}
  .issue-card .meta{font-size:11px;color:var(--muted);margin-bottom:8px;}
  .close-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;}
  label{display:block;font-size:12.5px;font-weight:700;margin:10px 0 5px;}
  input[type="number"],textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;}
  textarea{min-height:60px;}
  .report-btn{width:100%;background:var(--red);color:#fff;border:none;border-radius:10px;padding:12px;font-size:13.5px;font-weight:700;cursor:pointer;margin-top:14px;}
  .modal-close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 20px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;}
  .toast.show{opacity:1;}
  .toast.err{background:var(--red);}
</style>
</head>
<body>
<div class="topbar">
  <h1>⚙️ ความพร้อมใช้งานเครื่องจักร</h1>
  <a href="op-home.html">← กลับหน้าแรก</a>
</div>
<div class="wrap" id="app"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const CONFIG = { GAS_URL: "" }; // <-- ใส่ URL ของ Apps Script Web app หลัง deploy ตรงนี้
let allMachines = [];

function showToast(msg, kind){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show" + (kind==="err" ? " err" : "");
  setTimeout(()=> el.classList.remove("show"), 2600);
}

async function init(){
  document.getElementById("app").innerHTML = "<p>⏳ กำลังโหลดข้อมูล...</p>";
  if (!CONFIG.GAS_URL){ document.getElementById("app").innerHTML = "<p>⚠️ ยังไม่ได้ตั้งค่า GAS_URL ในไฟล์นี้</p>"; return; }
  try{
    const resp = await fetch(CONFIG.GAS_URL + "?action=machines");
    allMachines = await resp.json();
    render(allMachines);
  }catch(e){
    document.getElementById("app").innerHTML = "<p>เชื่อมต่อไม่สำเร็จ ลองรีเฟรชอีกครั้ง</p>";
  }
}

function render(machines){
  const app = document.getElementById("app");
  const totalNotReady = machines.reduce((s,m)=>s+m.notReady, 0);
  const totalAll = machines.reduce((s,m)=>s+m.total, 0);
  const totalReady = totalAll - totalNotReady;

  let html = `
    <input type="text" id="searchBox" placeholder="ค้นหาชื่อเครื่องจักร...">
    <div class="summary">
      <div class="sumcard"><div class="num">${totalAll}</div><div class="label">ทั้งหมด</div></div>
      <div class="sumcard"><div class="num" style="color:var(--green)">${totalReady}</div><div class="label">พร้อมใช้</div></div>
      <div class="sumcard issue"><div class="num">${totalNotReady}</div><div class="label">ไม่พร้อมใช้</div></div>
    </div>
  `;

  const cats = [...new Set(machines.map(m=>m.category))];
  cats.forEach(cat => {
    html += `<div class="cat-title">${cat}</div>`;
    machines.filter(m=>m.category===cat).forEach(m => {
      const full = m.notReady === 0;
      html += `
        <div class="mrow" data-cat="${m.category}" data-name="${m.name}">
          <div>
            <div class="name">${m.name}</div>
            <div class="qty">พร้อมใช้ ${m.ready}/${m.total}</div>
          </div>
          <span class="badge ${full?'full':'partial'}">${full ? '✅ พร้อมใช้ครบ' : '⚠️ '+m.notReady+' ไม่พร้อม'}</span>
        </div>
      `;
    });
  });
  app.innerHTML = html;

  app.querySelectorAll(".mrow").forEach(el=>{
    el.addEventListener("click", ()=> openMachineModal(el.getAttribute("data-cat"), el.getAttribute("data-name")));
  });
  document.getElementById("searchBox").addEventListener("input", (e)=>{
    const q = e.target.value.trim().toLowerCase();
    render(q ? allMachines.filter(m=>m.name.toLowerCase().includes(q)) : allMachines);
  });
}

async function openMachineModal(category, name){
  const modal = document.getElementById("modal");
  document.getElementById("modalBg").classList.add("show");
  modal.innerHTML = "<p>⏳ กำลังโหลด...</p>";

  const m = allMachines.find(x=>x.category===category && x.name===name);
  let issues = [];
  try{
    const resp = await fetch(CONFIG.GAS_URL + "?action=machine_issues&category=" + encodeURIComponent(category) + "&name=" + encodeURIComponent(name));
    issues = await resp.json();
  }catch(e){}

  modal.innerHTML = `
    <button class="modal-close" id="closeModalBtn">✕</button>
    <h3>${name}</h3>
    <div class="sub">${category} · พร้อมใช้ ${m.ready}/${m.total}</div>
    <div id="issuesList">
      ${issues.length ? issues.map(is => `
        <div class="issue-card">
          <div class="detail">${is.detail} (${is.qty} เครื่อง)</div>
          <div class="meta">แจ้งเมื่อ ${is.time}${is.reporter ? " · โดย "+is.reporter : ""}${is.vendor ? " · "+is.vendor : ""}</div>
          <button class="close-btn" data-row="${is.rowIndex}">✅ ปิดงาน</button>
        </div>
      `).join("") : "<p style='font-size:13px;color:var(--muted)'>ไม่มีปัญหาค้างอยู่</p>"}
    </div>
    <label>จำนวนที่ไม่พร้อมใช้งาน (เพิ่มใหม่)</label>
    <input type="number" id="qtyInput" min="1" value="1">
    <label>รายละเอียดปัญหา</label>
    <textarea id="detailInput" placeholder="ระบุอาการ/ปัญหาที่พบ..."></textarea>
    <label>ผู้รับผิดชอบ/บริษัท (ถ้ามี)</label>
    <input type="text" id="vendorInput" placeholder="เช่น บ.Johnson Controls">
    <label>ผู้แจ้ง</label>
    <input type="text" id="reporterInput" value="${localStorage.getItem('op_last_recorder')||''}">
    <button class="report-btn" id="reportBtn">📤 แจ้งปัญหาใหม่</button>
  `;
  document.getElementById("closeModalBtn").addEventListener("click", ()=>{ document.getElementById("modalBg").classList.remove("show"); });
  document.getElementById("reportBtn").addEventListener("click", ()=> submitIssue(category, name));
  modal.querySelectorAll(".close-btn").forEach(btn=>{
    btn.addEventListener("click", ()=> closeIssue(btn.getAttribute("data-row"), category, name));
  });
}

async function submitIssue(category, name){
  const qty = document.getElementById("qtyInput").value;
  const detail = document.getElementById("detailInput").value.trim();
  const vendor = document.getElementById("vendorInput").value.trim();
  const reporter = document.getElementById("reporterInput").value.trim();
  if (!detail){ showToast("กรุณาระบุรายละเอียดปัญหา", "err"); return; }
  if (!reporter){ showToast("กรุณาระบุชื่อผู้แจ้ง", "err"); return; }
  localStorage.setItem("op_last_recorder", reporter);

  try{
    const resp = await fetch(CONFIG.GAS_URL, {
      method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({ action:"machine_report", category, name, qty, detail, vendor, reporter })
    });
    const data = await resp.json();
    if (data.status === "ok"){
      showToast("แจ้งปัญหาสำเร็จ", "ok");
      document.getElementById("modalBg").classList.remove("show");
      init();
    } else { showToast(data.message || "เกิดข้อผิดพลาด", "err"); }
  }catch(e){ showToast("เชื่อมต่อไม่สำเร็จ", "err"); }
}

async function closeIssue(rowIndex, category, name){
  const closer = prompt("ชื่อผู้ปิดงาน:", localStorage.getItem("op_last_recorder")||"");
  if (closer === null) return;
  if (!closer.trim()){ showToast("กรุณาระบุชื่อผู้ปิดงาน", "err"); return; }
  try{
    const resp = await fetch(CONFIG.GAS_URL, {
      method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({ action:"machine_close", rowIndex, closer: closer.trim() })
    });
    const data = await resp.json();
    if (data.status === "ok"){
      showToast("ปิดงานเรียบร้อย", "ok");
      document.getElementById("modalBg").classList.remove("show");
      init();
    } else { showToast(data.message || "เกิดข้อผิดพลาด", "err"); }
  }catch(e){ showToast("เชื่อมต่อไม่สำเร็จ", "err"); }
}

init();
</script>
</body>
</html>
