<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ความพร้อมใช้งานเครื่องจักร</title>
<style>
  :root{
    --bg:#0e1015; --panel:#1a1d26; --panel2:#20232e; --line:#2b2f3b;
    --text:#f2f3f5; --muted:#8b90a0; --amber:#f0b429; --red:#e5533c; --green:#1c9c63;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Sarabun","Tahoma",sans-serif;background:var(--bg);color:var(--text);}
  .topbar{padding:16px 18px;border-bottom:1px solid var(--line);}
  .topbar .eyebrow{font-size:10.5px;letter-spacing:.08em;color:var(--muted);font-weight:700;text-transform:uppercase;}
  .topbar h1{font-size:19px;margin:4px 0 0;}
  .topbar a{color:var(--muted);font-size:12px;text-decoration:none;}
  .wrap{max-width:640px;margin:0 auto;padding:16px;}

  .strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px;-webkit-overflow-scrolling:touch;}
  .strip::-webkit-scrollbar{height:4px;}
  .strip-card{
    flex:0 0 auto;min-width:92px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;cursor:pointer;
  }
  .strip-card .num{font-size:20px;font-weight:800;color:var(--amber);}
  .strip-card .lbl{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;}

  input[type="text"]{
    width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);
    color:var(--text);font-size:14px;font-family:inherit;margin-bottom:14px;
  }
  input[type="text"]::placeholder{color:var(--muted);}

  .cat-row{
    display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:12px;
    padding:14px 16px;margin-bottom:10px;cursor:pointer;border-left:4px solid var(--accent,#555);
  }
  .badge2{
    flex-shrink:0;width:40px;height:40px;border-radius:10px;background:var(--accent,#555);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#0e1015;
  }
  .cat-info{flex:1;min-width:0;}
  .cat-name{font-size:14.5px;font-weight:700;}
  .cat-sub{font-size:11.5px;color:var(--muted);margin-top:1px;}
  .cat-right{text-align:right;flex-shrink:0;}
  .cat-count{font-size:16px;font-weight:800;}
  .cat-count-lbl{font-size:10.5px;color:var(--muted);}
  .cat-issue{font-size:10.5px;color:var(--red);font-weight:700;margin-top:2px;}

  .mrow{
    background:var(--panel);border-radius:12px;padding:13px 15px;margin-bottom:8px;
    display:flex;justify-content:space-between;align-items:center;cursor:pointer;
  }
  .mrow .name{font-size:13.5px;font-weight:700;}
  .mrow .qty{font-size:11.5px;color:var(--muted);margin-top:2px;}
  .pill{font-size:11.5px;font-weight:800;border-radius:999px;padding:4px 12px;white-space:nowrap;}
  .pill.full{background:rgba(28,156,99,.18);color:#3fd38a;}
  .pill.partial{background:rgba(229,83,60,.18);color:#ff8266;}

  .back-link{display:inline-block;margin-bottom:12px;color:var(--muted);font-size:13px;text-decoration:none;cursor:pointer;}
  .section-title{font-size:15px;font-weight:800;margin-bottom:14px;}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:50;}
  .modal-bg.show{display:flex;}
  .modal{background:var(--panel2);border-radius:16px 16px 0 0;padding:20px;width:100%;max-height:85vh;overflow:auto;}
  .modal h3{margin:0 0 2px;font-size:16px;}
  .modal .sub{font-size:12px;color:var(--muted);margin-bottom:14px;}
  .issue-card{background:var(--panel);border-radius:10px;padding:12px;margin-bottom:10px;}
  .issue-card .detail{font-size:13px;margin-bottom:6px;}
  .issue-card .meta{font-size:11px;color:var(--muted);margin-bottom:8px;}
  .close-btn{background:var(--green);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;}
  label{display:block;font-size:12.5px;font-weight:700;margin:10px 0 5px;color:var(--muted);}
  input[type="number"],textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:var(--panel);color:var(--text);}
  textarea{min-height:60px;}
  .report-btn{width:100%;background:var(--red);color:#fff;border:none;border-radius:10px;padding:12px;font-size:13.5px;font-weight:700;cursor:pointer;margin-top:14px;}
  .modal-close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--muted);}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);color:#fff;padding:11px 20px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;}
  .toast.show{opacity:1;}
  .toast.err{background:var(--red);border-color:var(--red);}

  .scan-btn{
    width:100%;background:linear-gradient(135deg,#0f7a72,#0a5850);color:#fff;border:none;border-radius:12px;
    padding:14px;font-size:14.5px;font-weight:800;cursor:pointer;margin-bottom:16px;
  }
  .qr-overlay{position:fixed;inset:0;background:#000;display:none;flex-direction:column;z-index:70;}
  .qr-overlay.show{display:flex;}
  .qr-overlay video{flex:1;width:100%;object-fit:cover;}
  .qr-overlay .scanHint{color:#fff;text-align:center;padding:14px;font-size:13.5px;}
  .qr-guide{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:min(65vw,280px);height:min(65vw,280px);
    border:3px solid #3fd38a;border-radius:16px;box-shadow:0 0 0 2000px rgba(0,0,0,.35);pointer-events:none;
  }
  .qr-overlay .closeBtn{
    position:absolute;top:14px;right:14px;background:rgba(255,255,255,.15);color:#fff;
    border:none;border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;
  }
  .verified-badge{
    display:inline-flex;align-items:center;gap:6px;background:rgba(28,156,99,.18);color:#3fd38a;
    font-size:12px;font-weight:700;border-radius:999px;padding:5px 12px;margin-bottom:14px;
  }
  .browse-note{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:12px;font-size:12.5px;color:var(--muted);margin-top:14px;text-align:center;}
  .scan-now-btn{background:var(--red);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:12.5px;font-weight:700;cursor:pointer;margin-top:8px;}
  .tech-section{margin-top:18px;margin-bottom:6px;font-size:13.5px;font-weight:800;color:var(--amber);border-bottom:1px solid var(--line);padding-bottom:6px;}
  .tech-section:first-of-type{margin-top:4px;}
  .tech-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);}
  .tech-row .tinfo{flex:1;min-width:0;}
  .tech-row .ttitle{font-size:12.5px;font-weight:600;}
  .tech-row .trange{font-size:10.5px;color:var(--muted);margin-top:1px;}
  .tech-row input{width:90px;flex-shrink:0;padding:8px;text-align:right;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);font-size:13.5px;font-family:inherit;}
  .tech-row .tunit{width:44px;flex-shrink:0;font-size:11.5px;color:var(--muted);}
  .toggle-pair{display:flex;gap:8px;margin-bottom:4px;}
  .tbtn{flex:1;padding:12px 8px;border-radius:8px;border:2px solid var(--line);background:var(--panel);color:var(--muted);font-size:13.5px;font-weight:800;cursor:pointer;transition:all .15s;}
  .tbtn.ok.active{background:#1c9c63;border-color:#1c9c63;color:#fff;box-shadow:0 0 0 3px rgba(28,156,99,.25);}
  .tbtn.bad.active{background:#e5533c;border-color:#e5533c;color:#fff;box-shadow:0 0 0 3px rgba(229,83,60,.25);}
</style>
</head>
<body>
<div class="topbar">
  <div class="eyebrow">Preventive Maintenance</div>
  <h1>ความพร้อมใช้งานเครื่องจักร</h1>
  <a href="index.html">← กลับหน้าแรก</a>
</div>
<div class="wrap" id="app"></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="qr-overlay" id="qrOverlay">
  <button class="closeBtn" id="qrCloseBtn">✕</button>
  <video id="qrVideo" playsinline muted></video>
  <div class="qr-guide"></div>
  <div class="scanHint" id="qrHint">ส่องกล้องไปที่ QR code หน้าเครื่อง</div>
</div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
  // ถ้า CDN หลักโหลดไม่สำเร็จ (เช่นถูกบล็อก) ลอง CDN สำรองอัตโนมัติ
  if (typeof jsQR !== "function"){
    document.write('<script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"><\/script>');
  }
</script>

<script>
const CONFIG = { GAS_URL: "https://script.google.com/macros/s/AKfycby145sVHKOvQUOvqMC7IogdlWeiVOAz6LVJCxMaePznS6hbHoBvFv_cbwJelW34blLtyA/exec" };

// รหัส/สี/ชื่อภาษาอังกฤษของแต่ละหมวด (ปรับสี/รหัสได้ตามต้องการ)
const CAT_META = {
  "หมวดที่ 1 ระบบปรับอากาศและระบายอากาศ": { code:"HV", sub:"HVAC · HVAC", color:"#3b82f6" },
  "หมวดที่ 2 ระบบไฟฟ้าและไฟฟ้าสื่อสาร": { code:"EL", sub:"Electrical · ELE", color:"#f0b429" },
  "หมวดที่ 3 ระบบ Building Automation System (BAS)": { code:"BA", sub:"BAS · BAS", color:"#a78bfa" },
  "หมวดที่ 4 ระบบสุขาภิบาล": { code:"SA", sub:"Sanitary · SAN", color:"#2dd4bf" },
  "หมวดที่ 5 ระบบบ่อพักน้ำเสีย": { code:"WW", sub:"Wastewater · WWT", color:"#22d3ee" },
  "หมวดที่ 6 ระบบป้องกันอัคคีภัย ดับเพลิงและรักษาความปลอดภัย": { code:"FA", sub:"Fire Alarm & Fighting · FAF", color:"#e5533c" },
  "หมวดที่ 7 ระบบขนส่ง": { code:"TR", sub:"Transportation · TRN", color:"#818cf8" },
  "หมวดที่ 8 ระบบแก๊สทางการแพทย์ และระบบแก๊ส LPG": { code:"MG", sub:"Medical Gas · MGS", color:"#ec4899" }
};

let allMachines = [];
let currentCategory = null;
let opStaffList = [];

// รายการตรวจเช็กเทคนิคเฉพาะทาง — ดึงจากฟอร์ม Chiller Plant Daily Inspection
// Record ของจริง ใช้แทนฟอร์มทั่วไป (ความสะอาด/เสียง/การทำงาน) เมื่อชื่อ
// เครื่องจักรตรงกับที่กำหนดไว้ในนี้ — เพิ่มเครื่องอื่นได้ทีหลังโดยเพิ่ม key
// ใหม่ในอ็อบเจ็กต์นี้ ไม่ต้องแก้โครงสร้างโค้ดส่วนอื่น
const TECH_CHECKLISTS = {
  "Chiller Water Cool": [
    { section: "Evaporator", items: [
      { key:"setPointTemp", title:"Set Point Temp.", range:"-", unit:"°F" },
      { key:"leavingChillerTemp", title:"Leaving Chiller Liquid Temp.", range:"44-45", unit:"°F" },
      { key:"returnChillerTemp", title:"Return Chiller Liquid Temp.", range:"50-60", unit:"°F" },
      { key:"evapSatRefTemp", title:"Evaporator Saturation Ref. Temp.", range:"35-47", unit:"°F" },
      { key:"smallTempDiffEvap", title:"Small Temp. Difference", range:"<4", unit:"°F" },
      { key:"leavingChilledPressure", title:"Leaving Chilled Pressure", range:"150-250", unit:"psig" },
      { key:"returnChilledPressure", title:"Return Chilled Pressure", range:"150-250", unit:"psig" },
      { key:"pressureDropEvap", title:"Pressure drop flow rate", range:"5", unit:"psig" },
      { key:"refrigerantPressureEvap", title:"Refrigerant Pressure", range:"35-47", unit:"psig" }
    ]},
    { section: "Condenser", items: [
      { key:"leavingCondTemp", title:"Leaving Condenser Liquid Temp.", range:"95-100", unit:"°F" },
      { key:"returnCondTemp", title:"Return Condenser Liquid Temp.", range:"85-95", unit:"°F" },
      { key:"condSatRefTemp", title:"Condenser Saturation Ref. Temp.", range:"90-110", unit:"°F" },
      { key:"smallTempDiffCond", title:"Small Temp. Difference", range:"<5", unit:"°F" },
      { key:"leavingCondPressure", title:"Leaving Condenser Pressure", range:"35-50", unit:"psig" },
      { key:"returnCondPressure", title:"Return Condenser Pressure", range:"40-60", unit:"psig" },
      { key:"pressureDropCond", title:"Pressure Drop Flow Rate", range:"13", unit:"psig" },
      { key:"refrigerantPressureCond", title:"Refrigerant Pressure", range:"<160", unit:"psig" }
    ]},
    { section: "Compressor & Motor", items: [
      { key:"runningHours", title:"Running Hours", range:"-", unit:"Hour" },
      { key:"oilPressure", title:"Oil Pressure", range:"34-35", unit:"psig" },
      { key:"oilSumpTemp", title:"Oil Sump Temp.", range:"110-145", unit:"°F" },
      { key:"dischargeTemp", title:"Discharge Temp.", range:"100-145", unit:"°F" },
      { key:"phaseCurrent", title:"Phase Current", range:"-", unit:"A" },
      { key:"fullLoadAmp", title:"Full Load Amp.", range:"100", unit:"%" },
      { key:"oilPumpLevel", title:"Oil Pump Level (Hi-Med-Lo)", range:"Mid-Hi", unit:"Level" }
    ]}
  ]
};

function showToast(msg, kind){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show" + (kind==="err" ? " err" : "");
  setTimeout(()=> el.classList.remove("show"), 2600);
}

async function init(){
  document.getElementById("app").innerHTML = "<p style='color:var(--muted)'>⏳ กำลังโหลดข้อมูล...</p>";
  if (!CONFIG.GAS_URL){ document.getElementById("app").innerHTML = "<p>⚠️ ยังไม่ได้ตั้งค่า GAS_URL</p>"; return; }
  try{
    const [machinesResp, staffResp] = await Promise.all([
      fetch(CONFIG.GAS_URL + "?action=machines"),
      fetch(CONFIG.GAS_URL + "?action=op_staff")
    ]);
    allMachines = await machinesResp.json();
    try{ opStaffList = await staffResp.json(); }catch(e){ opStaffList = []; }
    const params = new URLSearchParams(location.search);
    const cat = params.get("cat");
    const name = params.get("name");
    if (cat && name && allMachines.some(m=>m.category===cat && m.name===name)){
      renderCheckSheet(cat, name, true); // true = มาจากการสแกน QR จริง (ยืนยันตัวตน)
    } else {
      renderCategoryPicker();
    }
  }catch(e){
    document.getElementById("app").innerHTML = "<p>เชื่อมต่อไม่สำเร็จ ลองรีเฟรชอีกครั้ง</p>";
  }
}

function catsSummary(){
  const cats = [...new Set(allMachines.map(m=>m.category))];
  return cats.map(cat => {
    const items = allMachines.filter(m=>m.category===cat);
    const total = items.reduce((s,m)=>s+m.total,0);
    const notReady = items.reduce((s,m)=>s+m.notReady,0);
    return { cat, total, notReady, count: items.length };
  });
}

function renderCategoryPicker(){
  currentCategory = null;
  const app = document.getElementById("app");
  const summary = catsSummary();
  const grandTotal = allMachines.reduce((s,m)=>s+m.total,0);

  const stripHtml = `
    <div class="strip-card" style="border-color:#444;">
      <div class="num">${grandTotal.toLocaleString()}</div>
      <div class="lbl">ทั้งหมด</div>
    </div>
    ` + summary.map(s => {
      const meta = CAT_META[s.cat] || { code:"?", color:"#888" };
      return `
      <div class="strip-card" data-cat="${s.cat}">
        <div class="num" style="color:${meta.color}">${s.total.toLocaleString()}</div>
        <div class="lbl">${meta.code}</div>
      </div>
    `; }).join("");

  const listHtml = summary.map(s => {
    const meta = CAT_META[s.cat] || { code:"?", sub:"", color:"#888" };
    const nameOnly = s.cat.replace(/^หมวดที่ \d+\s*/, "");
    return `
      <div class="cat-row" data-cat="${s.cat}" style="--accent:${meta.color}">
        <div class="badge2" style="background:${meta.color}">${meta.code}</div>
        <div class="cat-info">
          <div class="cat-name">${nameOnly}</div>
          <div class="cat-sub">${meta.sub}</div>
        </div>
        <div class="cat-right">
          <div class="cat-count">${s.total.toLocaleString()}</div>
          <div class="cat-count-lbl">รายการ</div>
          ${s.notReady > 0 ? `<div class="cat-issue">⚠️ ${s.notReady} ไม่พร้อม</div>` : ""}
        </div>
      </div>
    `;
  }).join("");

  app.innerHTML = `
    <button class="scan-btn" id="scanBtn">📷 สแกน QR หน้าเครื่อง เพื่อบันทึกผลตรวจเช็ก</button>
    <div class="strip">${stripHtml}</div>
    <div class="section-title">เลือกระบบ</div>
    ${listHtml}
  `;
  document.getElementById("scanBtn").addEventListener("click", startQrScan);
  app.querySelectorAll("[data-cat]").forEach(el=>{
    el.addEventListener("click", ()=> renderMachineList(el.getAttribute("data-cat")));
  });
}

function renderMachineList(category){
  currentCategory = category;
  const app = document.getElementById("app");
  const meta = CAT_META[category] || { code:"?", color:"#888" };
  const nameOnly = category.replace(/^หมวดที่ \d+\s*/, "");

  function listFor(items){
    return items.map(m => {
      const full = m.notReady === 0;
      return `
        <div class="mrow" data-name="${m.name}">
          <div>
            <div class="name">${m.name}</div>
            <div class="qty">พร้อมใช้ ${m.ready}/${m.total}</div>
          </div>
          <span class="pill ${full?'full':'partial'}">${full ? '✅ พร้อมใช้ครบ' : '⚠️ '+m.notReady+' ไม่พร้อม'}</span>
        </div>
      `;
    }).join("");
  }

  const items = allMachines.filter(m=>m.category===category);
  app.innerHTML = `
    <a class="back-link" id="backLink">← เลือกหมวดอื่น</a>
    <div class="section-title" style="display:flex;align-items:center;gap:10px;">
      <span class="badge2" style="width:28px;height:28px;font-size:10px;background:${meta.color}">${meta.code}</span>
      ${nameOnly}
    </div>
    <input type="text" id="searchBox" placeholder="ค้นหาชื่อเครื่องจักรในหมวดนี้...">
    <div id="machineListArea">${listFor(items)}</div>
  `;
  document.getElementById("backLink").addEventListener("click", renderCategoryPicker);
  document.querySelectorAll(".mrow").forEach(el=>{
    el.addEventListener("click", ()=> openMachineModal(category, el.getAttribute("data-name")));
  });
  document.getElementById("searchBox").addEventListener("input", (e)=>{
    const q = e.target.value.trim().toLowerCase();
    const filtered = q ? items.filter(m=>m.name.toLowerCase().includes(q)) : items;
    document.getElementById("machineListArea").innerHTML = listFor(filtered);
    document.querySelectorAll(".mrow").forEach(el=>{
      el.addEventListener("click", ()=> openMachineModal(category, el.getAttribute("data-name")));
    });
  });
}

// โหมดดูอย่างเดียวจากการกดเลือกในลิสต์ — ดูสถานะ+ปิดงานปัญหาเดิมได้ แต่
// "บันทึกผลตรวจเช็กใหม่" ต้องสแกน QR หน้าเครื่องเท่านั้น (ยืนยันว่ามาจริง)
async function openMachineModal(category, name){
  const modal = document.getElementById("modal");
  document.getElementById("modalBg").classList.add("show");
  modal.innerHTML = "<p>⏳ กำลังโหลด...</p>";

  const m = allMachines.find(x=>x.category===category && x.name===name);
  let issues = [];
  try{
    const resp = await fetch(CONFIG.GAS_URL + "?action=machine_issues&category=" + encodeURIComponent(category) + "&name=" + encodeURIComponent(name));
    issues = await resp.json();
  }catch(e){}

  modal.innerHTML = `
    <button class="modal-close" id="closeModalBtn">✕</button>
    <h3>${name}</h3>
    <div class="sub">${category.replace(/^หมวดที่ \d+\s*/, "")} · พร้อมใช้ ${m.ready}/${m.total}</div>
    <div id="issuesList">
      ${issues.length ? issues.map(is => `
        <div class="issue-card">
          <div class="detail">${is.detail} (${is.qty} เครื่อง)</div>
          <div class="meta">แจ้งเมื่อ ${is.time}${is.reporter ? " · โดย "+is.reporter : ""}${is.vendor ? " · "+is.vendor : ""}</div>
          <button class="close-btn" data-row="${is.rowIndex}">✅ ปิดงาน</button>
        </div>
      `).join("") : "<p style='font-size:13px;color:var(--muted)'>ไม่มีปัญหาค้างอยู่</p>"}
    </div>
    <div class="browse-note">
      🔒 บันทึกผลตรวจเช็กใหม่ต้องสแกน QR หน้าเครื่องเท่านั้น เพื่อยืนยันว่าช่างเข้าปฏิบัติงานจริง
      <br><button class="scan-now-btn" id="scanNowBtn">📷 สแกนตอนนี้</button>
    </div>
  `;
  document.getElementById("closeModalBtn").addEventListener("click", ()=>{ document.getElementById("modalBg").classList.remove("show"); });
  document.getElementById("scanNowBtn").addEventListener("click", ()=>{ document.getElementById("modalBg").classList.remove("show"); startQrScan(); });
  modal.querySelectorAll(".close-btn").forEach(btn=>{
    btn.addEventListener("click", ()=> closeIssue(btn.getAttribute("data-row"), category, name));
  });
}

// ---------- ฟอร์มเช็กชีตตรวจเช็ก — เข้าได้จากการสแกน QR เท่านั้น ----------
function renderCheckSheet(category, name, verified){
  currentCategory = category;
  const app = document.getElementById("app");
  const m = allMachines.find(x=>x.category===category && x.name===name);
  const meta = CAT_META[category] || { code:"?", color:"#888" };
  const lastRecorder = localStorage.getItem('op_last_recorder') || "";
  const techSections = TECH_CHECKLISTS[name] || null;

  const unitFieldHtml = (m.total > 1) ? `
    <label>หมายเลขเครื่อง (ถ้ามี)</label>
    <input type="text" id="unitInput" placeholder="เช่น CH-1">
  ` : "";

  const bodyHtml = techSections ? techSections.map(sec => `
    <div class="tech-section">${sec.section}</div>
    ${sec.items.map(item => `
      <div class="tech-row">
        <div class="tinfo">
          <div class="ttitle">${item.title}</div>
          <div class="trange">เกณฑ์: ${item.range}</div>
        </div>
        <input type="text" id="tech_${item.key}" inputmode="decimal">
        <div class="tunit">${item.unit}</div>
      </div>
    `).join("")}
  `).join("") : `
    <label>ความสะอาด</label>
    <div class="toggle-pair" id="tp_cleanliness">
      <button type="button" class="tbtn ok" data-field="cleanliness" data-val="ปกติ">ปกติ</button>
      <button type="button" class="tbtn bad" data-field="cleanliness" data-val="ไม่ปกติ">ไม่ปกติ</button>
    </div>
    <label>เสียง/การสั่นสะเทือน</label>
    <div class="toggle-pair" id="tp_noise">
      <button type="button" class="tbtn ok" data-field="noise" data-val="ปกติ">ปกติ</button>
      <button type="button" class="tbtn bad" data-field="noise" data-val="ผิดปกติ">ผิดปกติ</button>
    </div>
    <label>การทำงานเมื่อทดสอบ</label>
    <div class="toggle-pair" id="tp_testRun">
      <button type="button" class="tbtn ok" data-field="testRun" data-val="ปกติ">ปกติ</button>
      <button type="button" class="tbtn bad" data-field="testRun" data-val="ผิดปกติ">ผิดปกติ</button>
    </div>
  `;

  app.innerHTML = `
    <a class="back-link" id="backLink">← เลือกหมวดอื่น</a>
    ${verified ? `<div class="verified-badge">✅ ยืนยันจากการสแกน QR หน้าเครื่อง</div>` : ""}
    <div class="section-title" style="display:flex;align-items:center;gap:10px;">
      <span class="badge2" style="width:28px;height:28px;font-size:10px;background:${meta.color}">${meta.code}</span>
      ${name}
    </div>
    <div style="color:var(--muted);font-size:12px;margin:-8px 0 16px;">${category.replace(/^หมวดที่ \d+\s*/, "")} · พร้อมใช้ ${m.ready}/${m.total}</div>

    ${unitFieldHtml}
    ${bodyHtml}

    <label style="margin-top:18px;">สถานะโดยรวม</label>
    <div class="toggle-pair" id="tp_overall">
      <button type="button" class="tbtn ok" data-field="overall" data-val="พร้อมใช้งาน">✅ พร้อมใช้งาน</button>
      <button type="button" class="tbtn bad" data-field="overall" data-val="ไม่พร้อมใช้งาน">⚠️ ไม่พร้อมใช้งาน</button>
    </div>

    <div id="issueFields" style="display:none;">
      <label>จำนวนที่ไม่พร้อมใช้งาน</label>
      <input type="number" id="qtyInput" min="1" value="1">
      <label>รายละเอียดปัญหา</label>
      <textarea id="detailInput" placeholder="ระบุอาการ/ปัญหาที่พบ..."></textarea>
      <label>ผู้รับผิดชอบ/บริษัท (ถ้ามี)</label>
      <input type="text" id="vendorInput" placeholder="เช่น บ.Johnson Controls">
    </div>

    <label>ผู้ตรวจ</label>
    <select id="inspectorSelect">
      <option value="">-- เลือกผู้ตรวจ --</option>
      ${opStaffList.map(n => `<option value="${n}" ${n===lastRecorder?"selected":""}>${n}</option>`).join("")}
      <option value="__other__" ${(lastRecorder && !opStaffList.includes(lastRecorder))?"selected":""}>อื่นๆ (พิมพ์ชื่อเอง)</option>
    </select>
    <input type="text" id="inspectorOther" placeholder="พิมพ์ชื่อผู้ตรวจ" style="display:${(lastRecorder && !opStaffList.includes(lastRecorder))?'block':'none'};margin-top:8px;" value="${(lastRecorder && !opStaffList.includes(lastRecorder))?lastRecorder:''}">

    <button class="report-btn" id="submitCheckBtn" style="background:var(--green);">📤 บันทึกผลตรวจเช็ก</button>
  `;
  document.getElementById("backLink").addEventListener("click", renderCategoryPicker);
  document.getElementById("inspectorSelect").addEventListener("change", (e)=>{
    document.getElementById("inspectorOther").style.display = (e.target.value === "__other__") ? "block" : "none";
  });

  const fieldState = {};
  app.querySelectorAll(".tbtn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const field = btn.getAttribute("data-field");
      const val = btn.getAttribute("data-val");
      fieldState[field] = val;
      app.querySelectorAll(`.tbtn[data-field="${field}"]`).forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      if (field === "overall"){
        document.getElementById("issueFields").style.display = (val === "ไม่พร้อมใช้งาน") ? "block" : "none";
      }
    });
  });

  document.getElementById("submitCheckBtn").addEventListener("click", ()=> submitCheckSheet(category, name, fieldState, techSections));
}

async function submitCheckSheet(category, name, fieldState, techSections){
  const selectEl = document.getElementById("inspectorSelect");
  const inspector = selectEl.value === "__other__"
    ? document.getElementById("inspectorOther").value.trim()
    : selectEl.value;

  let techReadings = null;
  if (techSections){
    techReadings = [];
    for (const sec of techSections){
      for (const item of sec.items){
        const el = document.getElementById("tech_"+item.key);
        techReadings.push({ section: sec.section, key: item.key, title: item.title, range: item.range, unit: item.unit, value: el.value.trim() });
      }
    }
  } else {
    if (!fieldState.cleanliness || !fieldState.noise || !fieldState.testRun){ showToast("กรุณาเลือกผลตรวจให้ครบทุกข้อ", "err"); return; }
  }
  if (!fieldState.overall){ showToast("กรุณาเลือกสถานะโดยรวม", "err"); return; }
  if (!inspector){ showToast("กรุณาระบุชื่อผู้ตรวจ", "err"); return; }
  let detail = "", vendor = "", qty = 1;
  if (fieldState.overall === "ไม่พร้อมใช้งาน"){
    detail = document.getElementById("detailInput").value.trim();
    vendor = document.getElementById("vendorInput").value.trim();
    qty = document.getElementById("qtyInput").value;
    if (!detail){ showToast("กรุณาระบุรายละเอียดปัญหา", "err"); return; }
  }
  localStorage.setItem("op_last_recorder", inspector);

  const unitEl = document.getElementById("unitInput");
  const unitNumber = unitEl ? unitEl.value.trim() : "";

  const btn = document.getElementById("submitCheckBtn");
  btn.disabled = true; btn.textContent = "กำลังบันทึก...";
  try{
    const resp = await fetch(CONFIG.GAS_URL, {
      method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({
        action:"machine_checksheet", category, name, unitNumber,
        cleanliness: fieldState.cleanliness || "", noise: fieldState.noise || "", testRun: fieldState.testRun || "",
        techReadings,
        overall: fieldState.overall, qty, detail, vendor, inspector
      })
    });
    const data = await resp.json();
    if (data.status === "ok"){
      showToast("บันทึกผลตรวจเช็กสำเร็จ", "ok");
      history.replaceState(null, "", location.pathname);
      setTimeout(()=>{ location.href = location.pathname; }, 1200);
    } else {
      showToast(data.message || "เกิดข้อผิดพลาด", "err");
      btn.disabled = false; btn.textContent = "📤 บันทึกผลตรวจเช็ก";
    }
  }catch(e){
    showToast("เชื่อมต่อไม่สำเร็จ", "err");
    btn.disabled = false; btn.textContent = "📤 บันทึกผลตรวจเช็ก";
  }
}

async function closeIssue(rowIndex, category, name){
  const closer = prompt("ชื่อผู้ปิดงาน:", localStorage.getItem("op_last_recorder")||"");
  if (closer === null) return;
  if (!closer.trim()){ showToast("กรุณาระบุชื่อผู้ปิดงาน", "err"); return; }
  try{
    const resp = await fetch(CONFIG.GAS_URL, {
      method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify({ action:"machine_close", rowIndex, closer: closer.trim() })
    });
    const data = await resp.json();
    if (data.status === "ok"){
      showToast("ปิดงานเรียบร้อย", "ok");
      document.getElementById("modalBg").classList.remove("show");
      await refreshAndStay();
    } else { showToast(data.message || "เกิดข้อผิดพลาด", "err"); }
  }catch(e){ showToast("เชื่อมต่อไม่สำเร็จ", "err"); }
}

// โหลดข้อมูลใหม่แล้วกลับไปหน้าเดิมที่ค้างอยู่ (หมวดที่กำลังดู หรือหน้าเลือกหมวด)
async function refreshAndStay(){
  try{
    const resp = await fetch(CONFIG.GAS_URL + "?action=machines");
    allMachines = await resp.json();
  }catch(e){}
  if (currentCategory) renderMachineList(currentCategory);
  else renderCategoryPicker();
}

// ---------- QR scanner ----------
let qrStream = null;
let qrRAF = null;
async function startQrScan(){
  const overlay = document.getElementById("qrOverlay");
  const video = document.getElementById("qrVideo");
  const hint = document.getElementById("qrHint");
  overlay.classList.add("show");
  try{
    qrStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
    video.srcObject = qrStream;
    await video.play();
    hint.textContent = "ส่องกล้องไปที่ QR code หน้าเครื่อง";
    scanFrame();
  }catch(e){
    hint.textContent = "เปิดกล้องไม่สำเร็จ — ตรวจสอบสิทธิ์การใช้กล้อง";
  }
}
function stopQrScan(){
  if (qrRAF) cancelAnimationFrame(qrRAF);
  if (qrStream) qrStream.getTracks().forEach(t=>t.stop());
  qrStream = null;
  document.getElementById("qrOverlay").classList.remove("show");
}
function scanFrame(){
  if (!qrStream) return; // ผู้ใช้ปิดกล้องไปแล้ว หยุด loop
  const video = document.getElementById("qrVideo");
  if (!video.videoWidth){ qrRAF = requestAnimationFrame(scanFrame); return; }

  if (typeof jsQR !== "function"){
    // ตัวอ่าน QR โหลดจาก CDN ไม่สำเร็จ (เช่น เน็ตบล็อกโดเมนภายนอก) — เดิม
    // โค้ดจะพังเงียบๆ ตรงนี้ ไม่ขึ้น error ให้เห็นเลย ตอนนี้แจ้งเตือนชัดเจนแทน
    document.getElementById("qrHint").textContent = "⚠️ โหลดตัวอ่าน QR ไม่สำเร็จ (เช็คสัญญาณอินเทอร์เน็ต) ลองปิดแล้วเปิดใหม่ หรือรีเฟรชหน้าเว็บ";
    return;
  }

  try{
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    const ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "dontInvert" });
    if (code && code.data){ handleQrDecoded(code.data); return; }
  }catch(err){
    console.error("QR scan frame error", err);
    // ไม่ทำอะไรเพิ่ม ปล่อยให้ loop ทำงานต่อในรอบถัดไป กันสแกนค้างจาก error ชั่วคราว
  }
  qrRAF = requestAnimationFrame(scanFrame);
}
function handleQrDecoded(text){
  let cat = null, name = null;
  try{
    const url = new URL(text);
    cat = url.searchParams.get("cat");
    name = url.searchParams.get("name");
  }catch(e){}
  stopQrScan();
  if (cat && name && allMachines.some(m=>m.category===cat && m.name===name)){
    renderCheckSheet(cat, name, true);
  } else {
    showToast("QR นี้ไม่ตรงกับเครื่องจักรในระบบ", "err");
  }
}
document.getElementById("qrCloseBtn").addEventListener("click", stopQrScan);

init();
</script>
