<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บันทึกส่งต่องาน</title>
<style>
  :root{ --navy:#0e2a3d; --teal:#0f7a72; --green:#1c9c63; --amber:#c9821a; --red:#c0392b; --line:#e4e4e0; --muted:#6b7178; --bg:#f6f6f2; }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Sarabun","Tahoma",sans-serif;background:var(--bg);color:var(--navy);}
  .topbar{background:var(--navy);color:#fff;padding:16px 18px;}
  .topbar h1{font-size:16px;margin:0 0 2px;}
  .topbar a{color:#fff;opacity:.75;font-size:12px;text-decoration:none;}
  .wrap{max-width:560px;margin:0 auto;padding:16px;padding-bottom:100px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;}
  .card h2{font-size:14.5px;margin:0 0 12px;padding-bottom:8px;border-bottom:1px solid var(--line);}
  label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;margin-top:12px;}
  label:first-child{margin-top:0;}
  input[type="text"],select,textarea{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:14.5px;font-family:inherit;
  }
  textarea{min-height:70px;resize:vertical;}
  .field-row{display:flex;gap:10px;}
  .field-row > div{flex:1;}
  .footer-bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px;}
  .footer-bar .inner{max-width:560px;margin:0 auto;}
  .submit-btn{width:100%;background:var(--teal);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer;}

  .history-item{border-bottom:1px solid var(--line);padding:12px 0;}
  .history-item:last-child{border-bottom:none;}
  .history-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
  .history-shift{font-size:13px;font-weight:700;color:var(--teal);}
  .history-time{font-size:11px;color:var(--muted);}
  .history-people{font-size:12.5px;color:var(--muted);margin-bottom:6px;}
  .history-field{font-size:13px;margin-bottom:4px;}
  .history-field b{font-weight:700;}
  .history-field.watch b{color:var(--amber);}
  .history-field.pending b{color:var(--red);}
  .empty-hint{font-size:13px;color:var(--muted);text-align:center;padding:10px 0;}

  .toast{
    position:fixed;left:50%;bottom:80px;transform:translateX(-50%);
    background:var(--navy);color:#fff;padding:11px 20px;border-radius:999px;font-size:13.5px;
    opacity:0;pointer-events:none;transition:opacity .25s;z-index:60;
  }
  .toast.show{opacity:1;}
  .toast.err{background:var(--red);}
</style>
</head>
<body>
<div class="topbar">
  <h1>🔄 บันทึกส่งต่องาน (Shift Handover)</h1>
  <a href="index.html">← กลับหน้าแรก</a>
</div>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
const CONFIG = { GAS_URL: "https://script.google.com/macros/s/AKfycby145sVHKOvQUOvqMC7IogdlWeiVOAz6LVJCxMaePznS6hbHoBvFv_cbwJelW34blLtyA/exec" };

let opStaffList = [];

function showToast(msg, kind){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = "toast show" + (kind==="err" ? " err" : "");
  setTimeout(()=> el.classList.remove("show"), 2600);
}
function todayShift(){
  const h = new Date().getHours();
  if (h < 8) return "ดึก (00:00-08:00)";
  if (h < 16) return "เช้า (08:00-16:00)";
  return "บ่าย (16:00-00:00)";
}

async function init(){
  document.getElementById("app").innerHTML = "<p>⏳ กำลังโหลดข้อมูล...</p>";
  if (!CONFIG.GAS_URL){ document.getElementById("app").innerHTML = "<p>⚠️ ยังไม่ได้ตั้งค่า GAS_URL</p>"; return; }
  try{
    const [staffResp, historyResp] = await Promise.all([
      fetch(CONFIG.GAS_URL + "?action=op_staff"),
      fetch(CONFIG.GAS_URL + "?action=handover_recent&limit=10")
    ]);
    opStaffList = await staffResp.json();
    const history = await historyResp.json();
    render(history);
  }catch(e){
    document.getElementById("app").innerHTML = "<p>เชื่อมต่อไม่สำเร็จ ลองรีเฟรชอีกครั้ง</p>";
  }
}

function staffOptions(selected){
  return `<option value="">-- เลือกชื่อ --</option>` +
    opStaffList.map(n => `<option value="${n}" ${n===selected?"selected":""}>${n}</option>`).join("");
}

function render(history){
  const app = document.getElementById("app");
  const lastFrom = localStorage.getItem("op_handover_from") || "";

  const historyHtml = history.length ? history.map(h => `
    <div class="history-item">
      <div class="history-head">
        <span class="history-shift">${h.shift}</span>
        <span class="history-time">${h.time}</span>
      </div>
      <div class="history-people">ส่งเวร: ${h.from || "-"} → รับเวร: ${h.to || "-"}</div>
      ${h.workDone ? `<div class="history-field"><b>งานที่ทำ:</b> ${h.workDone}</div>` : ""}
      ${h.pending ? `<div class="history-field pending"><b>⚠️ งานค้าง:</b> ${h.pending}</div>` : ""}
      ${h.watch ? `<div class="history-field watch"><b>👁️ ต้องเฝ้าระวัง:</b> ${h.watch}</div>` : ""}
      ${h.note ? `<div class="history-field"><b>หมายเหตุ:</b> ${h.note}</div>` : ""}
    </div>
  `).join("") : `<div class="empty-hint">ยังไม่มีประวัติการส่งเวร</div>`;

  app.innerHTML = `
    <div class="card">
      <h2>บันทึกการส่งเวรใหม่</h2>
      <label>กะ</label>
      <select id="shiftSelect">
        <option value="เช้า (08:00-16:00)">เช้า (08:00-16:00)</option>
        <option value="บ่าย (16:00-00:00)">บ่าย (16:00-00:00)</option>
        <option value="ดึก (00:00-08:00)">ดึก (00:00-08:00)</option>
      </select>

      <div class="field-row">
        <div>
          <label>ผู้ส่งเวร</label>
          <select id="fromSelect">${staffOptions(lastFrom)}</select>
        </div>
        <div>
          <label>ผู้รับเวร</label>
          <select id="toSelect">${staffOptions("")}</select>
        </div>
      </div>

      <label>งานที่ทำระหว่างเวร</label>
      <textarea id="workDone" placeholder="สรุปงานที่ทำไปแล้วในกะนี้..."></textarea>

      <label>งานค้าง / ต้องติดตามต่อ</label>
      <textarea id="pending" placeholder="งานที่ยังไม่เสร็จ ให้กะถัดไปติดตามต่อ..."></textarea>

      <label>จุดที่ต้องเฝ้าระวัง</label>
      <textarea id="watch" placeholder="เครื่อง/ระบบที่ผิดปกติ หรือต้องจับตาเป็นพิเศษ..."></textarea>

      <label>หมายเหตุอื่นๆ</label>
      <textarea id="note" placeholder="รายละเอียดเพิ่มเติม (ถ้ามี)"></textarea>
    </div>

    <div class="card">
      <h2>📜 ประวัติการส่งเวรล่าสุด</h2>
      ${historyHtml}
    </div>

    <div class="footer-bar">
      <div class="inner">
        <button class="submit-btn" id="submitBtn">บันทึกการส่งเวร</button>
      </div>
    </div>
  `;
  document.getElementById("shiftSelect").value = todayShift();
  document.getElementById("submitBtn").addEventListener("click", onSubmit);
}

async function onSubmit(){
  const shift = document.getElementById("shiftSelect").value;
  const from = document.getElementById("fromSelect").value;
  const to = document.getElementById("toSelect").value;
  if (!from){ showToast("กรุณาเลือกผู้ส่งเวร", "err"); return; }
  if (!to){ showToast("กรุณาเลือกผู้รับเวร", "err"); return; }
  localStorage.setItem("op_handover_from", from);

  const payload = {
    action: "handover_submit", shift, from, to,
    workDone: document.getElementById("workDone").value.trim(),
    pending: document.getElementById("pending").value.trim(),
    watch: document.getElementById("watch").value.trim(),
    note: document.getElementById("note").value.trim()
  };

  const btn = document.getElementById("submitBtn");
  btn.disabled = true; btn.textContent = "กำลังบันทึก...";
  try{
    const resp = await fetch(CONFIG.GAS_URL, { method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(payload) });
    const data = await resp.json();
    if (data.status === "ok"){
      showToast("บันทึกการส่งเวรสำเร็จ", "ok");
      setTimeout(()=>{ location.reload(); }, 1200);
    } else {
      showToast(data.message || "เกิดข้อผิดพลาด", "err");
      btn.disabled = false; btn.textContent = "บันทึกการส่งเวร";
    }
  }catch(e){
    showToast("เชื่อมต่อไม่สำเร็จ ลองใหม่อีกครั้ง", "err");
    btn.disabled = false; btn.textContent = "บันทึกการส่งเวร";
  }
}

init();
</script>
</body>
</html>
